<!DOCTYPE html>
<!-- 姓名：刘晗，日期：2026-09-10，功能名称：CSS 进阶 -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h2,h3,p{
            padding: 0;
            margin: 0;
        }
        #box{
            width: 480px;
            padding: 8px;
            border: 1px solid #ccc;
            font-size: 12px;
            margin: 20px;
        }
        #box h3{
            font-size: 16px;
            text-align: center;
            line-height: 33px;
            /* 字间距3px */
            letter-spacing: 3px;
            color:#036;
        }
        #box p{
            /* 行高 */
            line-height: 150%;
            color: #666;
            /* 首行缩进 */
            text-indent: 2em;
        }
        #box a{
            color: #f11;
            text-decoration: none;
            /* 加粗 */
            font-weight: bold;
        }
        .xuehao{
            /* 蓝色加粗 */
            color: blue;
            font-weight: bold;
        }
        .name{
            /* 深色加粗 */
            color: #333;
            font-weight: bold;
        }
        .nandu{
            /* 红色加粗 */
            color: #f11;
            font-weight: bold;
        }
        .zhishi{
            /* 紫色边框 */
            border: 1px solid rgb(122, 0, 153);
        }

    </style>
</head>
<body>
    <h2>css 进阶</h2>
    <div id="box">
        <h3>css那些事</h3>
        <p>
            学号：<span class="xuehao">0425</span>， 姓名：<span class="name">刘晗</span>，班级：计算机24004，对于《高级网页设计》课程的难度认知为：<span class="nandu">难</span>，
            这个例子对应的知识点是：<span class="zhishi">群组选择器、后代选择器、层叠与继承</span>。
            <a href="#">更多>></a>
        </p>
    </div>
    <!-- 学号：蓝色加粗；姓名：深色加粗，难度的值：红色加粗；知识点：紫色边框，边框为额外内容 -->
</body>
</html>
