<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS3 3D 动画</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #0c0e1a 0%, #1a1f35 100%);
      color: #e8eaf6;
      min-height: 100vh;
      padding: 32px 20px;
      overflow-x: hidden;
    }
    .liu_container { max-width: 1000px; margin: 0 auto; }
    h1 { text-align: center; font-size: 28px; margin-bottom: 6px; color: #fff; }
    .liu_subtitle { text-align: center; color: #90a4ae; margin-bottom: 36px; font-size: 14px; }
    .liu_grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 28px; }
    .liu_card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
    }
    .liu_card h2 { font-size: 17px; margin-bottom: 6px; color: #82b1ff; }
    .liu_card p { font-size: 13px; color: #90a4ae; margin-bottom: 20px; }
    .liu_stage {
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 600px;
      perspective-origin: center center;
    }

    .liu_cube {
      width: 70px; height: 70px;
      position: relative;
      transform-style: preserve-3d;
      animation: liu_spin 4s linear infinite;
    }
    .liu_face {
      position: absolute;
      width: 70px; height: 70px;
      border: 2px solid rgba(130,177,255,0.6);
      background: rgba(130,177,255,0.12);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: #82b1ff;
      backface-visibility: visible;
    }
    .liu_front  { transform: rotateY(0deg) translateZ(35px); }
    .liu_back   { transform: rotateY(180deg) translateZ(35px); }
    .liu_right  { transform: rotateY(90deg) translateZ(35px); }
    .liu_left   { transform: rotateY(-90deg) translateZ(35px); }
    .liu_top    { transform: rotateX(90deg) translateZ(35px); }
    .liu_bottom { transform: rotateX(-90deg) translateZ(35px); }
    @keyframes liu_spin {
      from { transform: rotateX(-20deg) rotateY(0deg); }
      to   { transform: rotateX(-20deg) rotateY(360deg); }
    }

    .liu_flip_card {
      width: 120px; height: 150px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }
    .liu_flip_card:hover { transform: rotateY(180deg); }
    .liu_flip_front, .liu_flip_back {
      position: absolute;
      width: 100%; height: 100%;
      backface-visibility: hidden;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 600;
    }
    .liu_flip_front { background: linear-gradient(135deg, #667eea, #764ba2); }
    .liu_flip_back {
      background: linear-gradient(135deg, #f093fb, #f5576c);
      transform: rotateY(180deg);
    }

    .liu_ring {
      width: 100px; height: 100px;
      border-radius: 50%;
      border: 6px solid transparent;
      border-top-color: #4fc3f7;
      border-right-color: #81c784;
      animation: liu_rotate 1.5s linear infinite;
      transform-style: preserve-3d;
    }
    .liu_ring:nth-child(2) {
      width: 70px; height: 70px;
      border-top-color: #ffb74d;
      border-right-color: #f06292;
      animation-direction: reverse;
      animation-duration: 2s;
    }
    .liu_ring_wrap { position: relative; width: 100px; height: 100px; transform-style: preserve-3d; animation: liu_rotateX 6s linear infinite; }
    @keyframes liu_rotate { to { transform: rotateZ(360deg); } }
    @keyframes liu_rotateX { 0%,100% { transform: rotateX(0deg); } 50% { transform: rotateX(180deg); } }

    .liu_z_float {
      width: 60px; height: 60px;
      background: linear-gradient(135deg, #ffd54f, #ff8a65);
      border-radius: 12px;
      animation: liu_zFloat 3s ease-in-out infinite;
      transform-style: preserve-3d;
    }
    @keyframes liu_zFloat {
      0%, 100% { transform: translateZ(0px) rotateZ(0deg); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
      50%      { transform: translateZ(80px) rotateZ(10deg); box-shadow: 0 25px 50px rgba(0,0,0,0.4); }
    }

    .liu_carousel {
      position: relative;
      width: 220px; height: 140px;
      transform-style: preserve-3d;
      animation: liu_spinSlow 8s linear infinite;
    }
    .liu_panel {
      position: absolute;
      width: 100px; height: 120px;
      left: 60px; top: 10px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 600;
      border: 1px solid rgba(255,255,255,0.2);
      backface-visibility: hidden;
    }
    .liu_panel:nth-child(1) { background: linear-gradient(135deg,#43e97b,#38f9d7); transform: rotateY(0deg) translateZ(80px); }
    .liu_panel:nth-child(2) { background: linear-gradient(135deg,#4facfe,#00f2fe); transform: rotateY(72deg) translateZ(80px); }
    .liu_panel:nth-child(3) { background: linear-gradient(135deg,#fa709a,#fee140); transform: rotateY(144deg) translateZ(80px); }
    .liu_panel:nth-child(4) { background: linear-gradient(135deg,#a18cd1,#fbc2eb); transform: rotateY(216deg) translateZ(80px); }
    .liu_panel:nth-child(5) { background: linear-gradient(135deg,#ffecd2,#fcb69f); transform: rotateY(288deg) translateZ(80px); }
    @keyframes liu_spinSlow { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
  </style>
</head>
<body>
  <div class="liu_container">
    <h1>CSS3 3D 动画</h1>
    <p class="liu_subtitle">使用 transform-style: preserve-3d 与 perspective 实现</p>

    <div class="liu_grid">
      <div class="liu_card">
        <h2>旋转立方体</h2>
        <p>六个面 + preserve-3d + rotateY</p>
        <div class="liu_stage">
          <div class="liu_cube">
            <div class="liu_face liu_front">前</div>
            <div class="liu_face liu_back">后</div>
            <div class="liu_face liu_right">右</div>
            <div class="liu_face liu_left">左</div>
            <div class="liu_face liu_top">顶</div>
            <div class="liu_face liu_bottom">底</div>
          </div>
        </div>
      </div>

      <div class="liu_card">
        <h2>3D 翻转卡片</h2>
        <p>hover 触发 rotateY(180deg) 翻面</p>
        <div class="liu_stage">
          <div class="liu_flip_card">
            <div class="liu_flip_front">正面</div>
            <div class="liu_flip_back">背面</div>
          </div>
        </div>
      </div>

      <div class="liu_card">
        <h2>嵌套 3D 圆环</h2>
        <p>多层圆环不同方向旋转 + rotateX</p>
        <div class="liu_stage">
          <div class="liu_ring_wrap">
            <div class="liu_ring"></div>
            <div class="liu_ring"></div>
          </div>
        </div>
      </div>

      <div class="liu_card">
        <h2>Z 轴悬浮</h2>
        <p>translateZ + rotateZ 模拟深度悬浮</p>
        <div class="liu_stage">
          <div class="liu_z_float"></div>
        </div>
      </div>

      <div class="liu_card">
        <h2>3D 图片轮播</h2>
        <p>5 个面板围成圆柱 + 整体 rotateY</p>
        <div class="liu_stage">
          <div class="liu_carousel">
            <div class="liu_panel">A</div>
            <div class="liu_panel">B</div>
            <div class="liu_panel">C</div>
            <div class="liu_panel">D</div>
            <div class="liu_panel">E</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
