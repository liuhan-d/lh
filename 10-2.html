<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-2 幻灯片</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f4f4f4;
            font-family: "Microsoft YaHei", sans-serif;
        }

        .slider {
            width: 680px;
            height: 500px;
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .18);
            background: #fff;
        }

        .slide {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            animation: slide 9s infinite;
            opacity: 0;
        }

        .slide:nth-child(1) {
            animation-delay: 0s;
        }

        .slide:nth-child(2) {
            animation-delay: 3s;
        }

        .slide:nth-child(3) {
            animation-delay: 6s;
        }

        .slide img {
            display: block;
            width: 100%;
            height: 420px;
            object-fit: cover;
        }

        .slide .text {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 80px;
            line-height: 80px;
            text-align: center;
            font-size: 24px;
            color: #fff;
            background: transparent;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.8);
        }

        @keyframes slide {
            0% {
                opacity: 1;
                transform: translateX(100%);
                z-index: 1;
            }
            12% {
                opacity: 1;
                transform: translateX(0);
            }
            33% {
                opacity: 1;
                transform: translateX(0);
            }
            45% {
                opacity: 1;
                transform: translateX(-100%);
            }
            100% {
                opacity: 0;
                transform: translateX(-100%);
                z-index: 0;
            }
        }
    </style>
</head>
<body>
    <div class="slider">
        <div class="slide">
            <img src="./img/1.jpg" alt="图1">
            <div class="text">刘晗</div>
        </div>
        <div class="slide">
            <img src="./img/2.jpg" alt="图2">
            <div class="text">刘晗 · 生活记录</div>
        </div>
        <div class="slide">
            <img src="./img/3.jpg" alt="图3">
            <div class="text">刘晗 · 作品展示</div>
        </div>
    </div>
</body>
</html>
