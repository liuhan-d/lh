<!DOCTYPE html>
<!-- 姓名：刘晗，日期：2026-09-07，功能名称：层叠样式表 CSS -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>425 刘晗</title>
    <style>
        p{
            color:#94a;
            font-size: 50px;
        }
        /* 标签选择器 */
        #box{
            width: 600px;
            height: 500px;
            background-color: #ccc;
        }
       #box2{
            width: 300px;
            height: 300px;
            background-color: pink;
        }
        h2{
            color: white;
            background-color: black;
        }
    /* id选择器，以#开头 */
    .n1{
        color:blue;
    }
    .n2{
        color: aqua;
    }
    .n3{
        color: white;
    }
    </style>
</head>
<body>
    <h2>层叠样式表 CSS</h2>
    <div id="box">
        <p>CSS<span class="n3">选择器</span></p>
        <p><span class="n1">刘</span><span class="n2">晗</span></p>
        <p>CSS属性</p>
    </div>
    <div id="box2"></div>
</body>
</html>
