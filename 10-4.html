<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-4 Media Query Layout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-width: 320px;
            font-family: "Microsoft YaHei", sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .wrap {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .item {
            flex: 1 1 20%;
            min-height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            color: #fff;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        @media (max-width: 1000px) {
            .item {
                flex-basis: 25%;
            }
        }

        @media (max-width: 700px) {
            .item {
                flex-basis: 50%;
            }
        }

        @media (max-width: 420px) {
            .item {
                flex-basis: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="item">刘晗</div>
        <div class="item">刘晗</div>
        <div class="item">刘晗</div>
        <div class="item">刘晗</div>
        <div class="item">刘晗</div>
        <div class="item">刘晗</div>
        <div class="item">刘晗</div>
        <div class="item">刘晗</div>
    </div>
</body>
</html>
