<style>
:root{
    --lh-green:#2db84d;          /* 豆瓣绿：选中态 */
    --lh-dark:#3f3f3f;           /* 未选中态（与原图一致） */
    --lh-bg:#f7f8fa;
    --lh-line:#ececec;
}
*{box-sizing:border-box}
body{
    margin:0; padding:40px 16px 80px;
    font-family:"Microsoft YaHei","PingFang SC",system-ui,Arial;
    color:#333; background:var(--lh-bg); line-height:1.6;
}
.lh_top{max-width:760px; margin:0 auto 26px}
.lh_top h1{font-size:22px; margin:0 0 6px}
.lh_top p{margin:0; color:#888; font-size:13px}
.lh_back{color:#2db84d; text-decoration:none; font-size:13px}
.lh_back:hover{text-decoration:underline}

/* ---------- 手机框：自适应宽度，窄屏时占满 ---------- */
.lh_phone{
    position:relative; width:100%; max-width:400px; margin:0 auto;
    height:430px; background:#fff; border-radius:24px;
    border:1px solid var(--lh-line);
    box-shadow:0 14px 34px rgba(0,0,0,.08);
    overflow:hidden;
}
.lh_screen{
    padding:24px 22px; text-align:center;
}
.lh_screen h3{margin:26px 0 4px; font-size:34px; color:var(--lh-green); letter-spacing:6px; font-weight:700}
.lh_screen p{margin:0; color:#b9bdc4; font-size:13px}

/* ---------- 下导航：固定底部，flex 等分自适应任意宽度 ---------- */
.lh_nav{
    position:absolute; left:0; right:0; bottom:0;
    display:flex; align-items:stretch;
    background:#fff; border-top:1px solid var(--lh-line);
    padding-bottom:6px;               /* 模拟 iOS 安全区 */
}
.lh_nav a{
    flex:1;                            /* 自适应：任意宽度下等分 */
    min-width:0;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:9px 2px 2px;
    text-decoration:none;
    color:var(--lh-dark);              /* CSS 修饰：未选中颜色 */
    transition:color .2s;
}
.lh_nav a span{font-size:12px; transform:scale(.92)}
.lh_nav a.on{color:var(--lh-green)}    /* CSS 修饰：选中变豆瓣绿 */

/* ---------- SVG 图标：CSS 控制填充色与大小 ---------- */
.lh_nav svg{width:27px; height:27px; display:block}
.lh_nav svg path{fill:currentColor; transition:fill .2s}   /* 去除图标固定色，交由 CSS 控制 */

.lh_note{max-width:400px; margin:14px auto 0; font-size:12px; color:#a0a4ab; text-align:center}
</style>
</head>

<p class="lh_note">提示：拖动浏览器窗口改变宽度，导航始终等分自适应；点击图标可切换选中态（豆瓣绿）。SVG 图标来自 iconfont（img/ 目录同名文件）。</p>

<script>
/* 图像解决方案 · 豆瓣下导航交互 —— 姓名：刘晗（lh_ 前缀） */
(function(){
    /* 点击切换选中态：导航内仅一项高亮 */
    var lh_bar = document.querySelector('.lh_nav');
    lh_bar.addEventListener('click', function(lh_ev){
        var lh_link = lh_ev.target.closest('a');
        if(!lh_link){ return; }
        lh_bar.querySelectorAll('a').forEach(function(lh_a){
            lh_a.classList.remove('on');
        });
        lh_link.classList.add('on');
    });
})();
</script>
